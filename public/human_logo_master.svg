<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" width="100%" height="100%">
  <!-- Left Badge Graphic -->
  <g transform="translate(10, 10)">
    <!-- Circle Ring -->
    <circle cx="80" cy="80" r="72" fill="none" stroke="#FFFFFF" stroke-width="9"/>
    <!-- Head -->
    <circle cx="80" cy="52" r="10" fill="#FFFFFF"/>
    <!-- Torso -->
    <path d="M 72,66 L 88,66 L 86,94 L 74,94 Z" fill="#FFFFFF"/>
    <!-- Legs -->
    <rect x="71" y="96" width="7" height="42" rx="3.5" fill="#FFFFFF"/>
    <rect x="82" y="96" width="7" height="42" rx="3.5" fill="#FFFFFF"/>
    <!-- Arms -->
    <path d="M 73,68 L 52,36 M 87,68 L 108,36" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
    <!-- Barbell -->
    <line x1="32" y1="34" x2="128" y2="34" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <!-- Left Plates -->
    <rect x="38" y="20" width="6" height="28" rx="1.5" fill="#FFFFFF"/>
    <rect x="46" y="24" width="4" height="20" rx="1" fill="#FFFFFF"/>
    <!-- Right Plates -->
    <rect x="116" y="20" width="6" height="28" rx="1.5" fill="#FFFFFF"/>
    <rect x="110" y="24" width="4" height="20" rx="1" fill="#FFFFFF"/>
  </g>

  <!-- Typography Group -->
  <!-- "HUMAN V1" -->
  <text x="200" y="70" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="800" font-size="52" fill="#FFFFFF" letter-spacing="-1">HUMAN V1</text>
  
  <!-- "STRENGTH" -->
  <text x="202" y="112" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="700" font-size="28" fill="#0066FF" letter-spacing="10">STRENGTH</text>
  
  <!-- Subtle blue accent line -->
  <line x1="202" y1="128" x2="620" y2="128" stroke="#0066FF" stroke-width="2" stroke-opacity="0.6"/>
  <circle cx="340" cy="128" r="4" fill="#0066FF"/>

  <!-- "TRAIN. TRACK. TRANSFORM." -->
  <text x="202" y="152" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="600" font-size="14" fill="#94A3B8" letter-spacing="4">TRAIN. TRACK. TRANSFORM.</text>
</svg>
