<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#0A0D10"/>
  
  <!-- Outer Badge Circle Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#FFFFFF" stroke-width="22"/>
  
  <!-- Lifter - Head -->
  <circle cx="256" cy="184" r="24" fill="#FFFFFF"/>
  
  <!-- Lifter - Torso -->
  <path d="M 238,220 L 274,220 L 270,290 L 242,290 Z" fill="#FFFFFF"/>
  
  <!-- Lifter - Left Leg -->
  <rect x="236" y="294" width="16" height="100" rx="8" fill="#FFFFFF"/>
  
