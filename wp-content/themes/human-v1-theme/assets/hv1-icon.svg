  <!-- Right Weight Plates -->
  <rect x="350" y="108" width="12" height="68" rx="3" fill="#FFFFFF"/>
  <rect x="336" y="118" width="8" height="48" rx="2" fill="#FFFFFF"/>
  <line x1="362" y1="142" x2="370" y2="142" stroke="#FFFFFF" stroke-width="14"/>
